[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-optimizer"
version = "2.5.0"
description = "Ultra-fast zero-dependency static performance analyzer for Angular, React, Node.js, SQL, and AWS."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Performance Optimizer Core Team" }
]
keywords = ["performance", "static-analysis", "angular", "react", "nodejs", "sql", "aws", "latency", "optimizer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.scripts]
perf-optimizer = "optimizer:main"
performance-optimizer = "optimizer:main"

[tool.setuptools]
py-modules = ["optimizer"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzers*", "core*", "reporter*"]

